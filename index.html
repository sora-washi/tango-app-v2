<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100">

<div id="app" class="w-full md:max-w-3xl mx-auto flex flex-col bg-gray-50 dark:bg-gray-900">
  <header class="bg-blue-600 dark:bg-blue-800 text-white text-center py-3 font-bold text-xl shadow-md z-10 sticky top-0" style="padding-top:calc(.75rem + env(safe-area-inset-top))">
    <span id="headerTitle">Flashcards</span>
  </header>

  <main class="p-3 md:p-4 flex-1">
    <h1 class="sr-only">無料AI単語帳アプリ Ultimate Flashcard｜英単語の意味を自動生成してスワイプで暗記</h1>
    <noscript><p class="p-4">Ultimate Flashcardは、英単語の意味をAIが自動生成してくれる無料の単語帳（フラッシュカード）アプリです。スマホ・PCのブラウザで使えます。JavaScriptを有効にしてご利用ください。</p></noscript>

    <!-- フォルダー -->
    <div id="folderScreen">
      <h2 class="text-xl font-bold mb-3 border-b pb-2 dark:border-gray-700">フォルダー</h2>
      <div id="folderList" class="space-y-3 mb-5"></div>
      <button onclick="createNewFolder()" class="w-full bg-white dark:bg-gray-800 text-blue-600 font-bold py-3 rounded-lg border-2 border-blue-600 mb-5">＋ 新しいフォルダーを作成</button>
      <h2 class="text-xl font-bold mb-3 border-b pb-2 dark:border-gray-700 text-red-500">復習</h2>
      <button onclick="startWeakTest()" class="w-full bg-red-50 text-red-600 font-bold py-4 rounded-lg border-2 border-red-200">⚠️ 苦手な単語を再テスト (<span id="weakCount">0</span>)</button>
    </div>

    <!-- 編集 -->
    <div id="editScreen" class="hidden">
      <div class="flex justify-between items-center mb-3 gap-2">
        <h2 id="editFolderTitle" class="text-xl font-bold truncate"></h2>
        <select id="folderLang" onchange="saveFolderLang()" class="bg-gray-100 dark:bg-gray-700 border rounded p-2 outline-none">
          <option value="en-US">読上: 英語</option>
          <option value="ja-JP">読上: 日本語</option>
        </select>
      </div>
      <div class="flex gap-2 mb-3 p-1 bg-gray-200 dark:bg-gray-700 rounded-lg">
        <button id="modeManual" onclick="setAiMode('manual')" class="flex-1 text-sm font-bold rounded">📝 単語＋意味</button>
        <button id="modeAuto" onclick="setAiMode('auto')" class="flex-1 text-sm font-bold rounded">✨ AIおまかせ</button>
      </div>
      <p id="editDesc" class="text-sm text-gray-500 mb-2"></p>
      <textarea id="wordInput" class="w-full h-56 md:h-80 p-3 border rounded-lg bg-white dark:bg-gray-800 focus:ring-2 focus:ring-blue-500 outline-none resize-none mb-3"></textarea>
      <div id="errorBox" class="hidden mb-3 p-3 rounded-lg bg-red-50 border border-red-300 text-red-700 text-sm"></div>
      <div class="flex gap-2">
        <button onclick="processWords()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-lg">AIチェック・登録</button>
        <button onclick="saveRawFromInput()" class="px-3 bg-yellow-100 text-yellow-800 font-bold rounded-lg text-sm">AIなしで保存</button>
        <button onclick="showScreen('folder')" class="px-4 bg-gray-300 text-gray-700 font-bold rounded-lg">戻る</button>
      </div>
    </div>

    <!-- AI確認 -->
    <div id="validationScreen" class="hidden">
      <h2 class="text-xl font-bold mb-1 text-blue-600">AI チェック結果</h2>
      <p class="text-sm text-gray-500 mb-3">右の欄は自由に編集できます。確認して保存してください。</p>
      <div id="validationList" class="space-y-3 mb-4"></div>
      <div class="flex gap-2">
        <button onclick="saveValidatedWords()" class="flex-1 bg-green-500 text-white font-bold py-3 rounded-lg">この内容で登録</button>
        <button onclick="showScreen('edit')" class="px-4 bg-gray-300 text-gray-700 font-bold rounded-lg">戻る</button>
      </div>
    </div>

    <!-- テスト設定 -->
    <div id="testSettingScreen" class="hidden">
      <h2 id="testFolderTitle" class="text-2xl font-bold mb-5 text-center"></h2>
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm mb-5">
        <h3 class="font-bold mb-3 border-b dark:border-gray-700 pb-1">出題の向き</h3>
        <div class="flex gap-2 mb-5">
          <label class="flex-1 text-center p-3 border rounded-lg cursor-pointer bg-blue-50 border-blue-500">
            <input type="radio" name="testDirection" value="forward" checked class="hidden">
            <div class="font-bold text-blue-700">順引き</div><div class="text-xs text-gray-500">単語 → 意味</div>
          </label>
          <label class="flex-1 text-center p-3 border rounded-lg cursor-pointer">
            <input type="radio" name="testDirection" value="reverse" class="hidden">
            <div class="font-bold">逆引き</div><div class="text-xs text-gray-500">意味 → 単語</div>
          </label>
        </div>
        <h3 class="font-bold mb-3 border-b dark:border-gray-700 pb-1">出題数</h3>
        <div class="flex gap-2">
          <button onclick="startTest(10)" class="flex-1 py-4 bg-gray-100 text-gray-800 font-bold rounded-lg">10問</button>
          <button onclick="startTest(20)" class="flex-1 py-4 bg-gray-100 text-gray-800 font-bold rounded-lg">20問</button>
          <button onclick="startTest('all')" class="flex-1 py-4 bg-blue-100 text-blue-700 font-bold rounded-lg">すべて</button>
        </div>
      </div>
      <button onclick="showScreen('folder')" class="w-full bg-gray-300 text-gray-700 font-bold py-3 rounded-lg">やめる</button>
    </div>

    <!-- テスト -->
    <div id="testScreen" class="hidden">
      <div class="flex justify-between items-center px-1">
        <button onclick="showScreen('folder')" class="text-gray-500 font-bold px-2">✕ 中断</button>
        <div class="font-bold text-gray-500" id="progressText"></div>
        <button onclick="speakCurrentWord()" class="text-2xl px-2">🔊</button>
      </div>
      <div class="card-container" id="cardContainer">
        <div class="card" id="flashcard" onclick="flipCard()">
          <div class="card-face card-front">
            <div class="text-sm text-gray-400 mb-3">タップして答えを見る</div>
            <div id="cardQ" class="font-extrabold break-words max-w-full"></div>
          </div>
          <div class="card-face card-back">
            <div id="cardA" class="font-bold text-red-500 dark:text-blue-400 break-words max-w-full"></div>
          </div>
        </div>
      </div>
      <div class="flex gap-3 opacity-0 pointer-events-none transition-opacity duration-300" id="judgementBtns">
        <button onclick="judgeWord(false)" class="flex-1 bg-red-100 border-2 border-red-500 text-red-600 font-bold py-4 rounded-xl">← 分からない</button>
        <button onclick="judgeWord(true)" class="flex-1 bg-green-100 border-2 border-green-500 text-green-600 font-bold py-4 rounded-xl">覚えた →</button>
      </div>
      <div id="ad-space" class="w-full bg-gray-200 dark:bg-gray-800 text-center py-3 text-gray-400 text-sm hidden mt-3">スポンサーリンク</div>
    </div>

    <!-- 設定 -->
    <div id="settingsScreen" class="hidden">
      <h2 class="text-xl font-bold mb-3 border-b pb-2 dark:border-gray-700">設定</h2>
      <div class="space-y-4">
        <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm flex justify-between items-center">
          <span class="font-bold">🌙 ダークモード</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="darkModeToggle" class="sr-only peer" onchange="toggleDarkMode()">
            <div class="w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
          </label>
        </div>
        <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm">
          <h3 class="font-bold mb-3">💾 バックアップと復元</h3>
          <div class="flex gap-3">
            <button onclick="exportData()" class="flex-1 bg-green-500 text-white font-bold py-3 rounded shadow">エクスポート</button>
            <label class="flex-1 bg-yellow-500 text-white font-bold py-3 rounded shadow text-center cursor-pointer">インポート
              <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
            </label>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<nav class="fixed bottom-0 inset-x-0 mx-auto w-full md:max-w-3xl bg-white dark:bg-gray-800 border-t dark:border-gray-700 flex justify-around p-2 z-10" style="padding-bottom:calc(.5rem + env(safe-area-inset-bottom))" id="bottomNav">
  <button onclick="showScreen('folder')" class="flex flex-col items-center px-6 text-blue-600"><span class="text-2xl">📁</span><span class="text-xs font-bold">フォルダー</span></button>
  <button onclick="showScreen('settings')" class="flex flex-col items-center px-6 text-gray-500"><span class="text-2xl">⚙️</span><span class="text-xs font-bold">設定</span></button>
</nav>

<div id="loadingOverlay" class="hidden fixed inset-0 bg-white/90 dark:bg-gray-900/90 flex flex-col items-center justify-center z-50">
  <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-blue-500 mb-4"></div>
  <p class="font-bold">AIが処理中...</p>
</div>

<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $ = id => document.getElementById(id);

  let appData;
  try { appData = JSON.parse(localStorage.getItem('ultimateFlashcards')); } catch (e) {}
  if (!appData || !appData.folders) appData = { folders: [{ id: 1, name: "基本の英単語", lang: "en-US", words: [{ id: 1, q: "apple", a: "りんご", weak: false }] }], settings: { darkMode: false } };
  appData.settings = appData.settings || { darkMode: false };

  let currentFolderId = null, aiMode = 'manual', testQueue = [], currentTestIndex = 0, testConfig = { direction: 'forward' }, tempValidatedWords = [];

  function init() {
    if (appData.settings.darkMode) { document.documentElement.classList.add('dark'); $('darkModeToggle').checked = true; }
    document.querySelectorAll('input[name="testDirection"]').forEach(radio => radio.addEventListener('change', () => {
      document.querySelectorAll('input[name="testDirection"]').forEach(r => {
        const on = r.checked, p = r.parentElement;
        p.classList.toggle('bg-blue-50', on); p.classList.toggle('border-blue-500', on);
        p.querySelector('.font-bold').classList.toggle('text-blue-700', on);
      });
    }));
    setupSwipe(); showScreen('folder');
  }

  function saveData() { localStorage.setItem('ultimateFlashcards', JSON.stringify(appData)); updateWeakCount(); }
  function updateWeakCount() { let c = 0; appData.folders.forEach(f => f.words.forEach(w => { if (w.weak) c++; })); $('weakCount').innerText = c; }

  function showScreen(screen) {
    ['folderScreen','editScreen','validationScreen','testSettingScreen','testScreen','settingsScreen'].forEach(s => $(s).classList.add('hidden'));
    $('bottomNav').classList.toggle('hidden', ['test','edit','validation','testSetting'].includes(screen));
    if (screen === 'folder') { $('headerTitle').innerText = "フォルダー"; renderFolderList(); updateWeakCount(); }
    if (screen === 'settings') $('headerTitle').innerText = "設定";
    $(screen + 'Screen').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function renderFolderList() {
    const list = $('folderList'); list.innerHTML = '';
    appData.folders.forEach(f => {
      const div = document.createElement('div');
      div.className = "bg-white dark:bg-gray-800 p-3 rounded-lg shadow-sm border dark:border-gray-700 flex justify-between items-center gap-2";
      div.innerHTML = `<div class="flex-1 min-w-0 cursor-pointer py-1" onclick="openTestSetting(${f.id})"><h3 class="font-bold text-lg truncate">${esc(f.name)}</h3><p class="text-sm text-gray-500">${f.words.length} 単語 | 🗣️ ${f.lang === 'ja-JP' ? '日本語' : '英語'}</p></div><button onclick="openEdit(${f.id})" class="bg-gray-200 dark:bg-gray-700 px-4 rounded font-bold">編集</button><button onclick="deleteFolder(${f.id})" class="text-red-400 px-3 text-lg">✕</button>`;
      list.appendChild(div);
    });
  }

  function createNewFolder() { const name = prompt("新しいフォルダー名を入力"); if (name && name.trim()) { appData.folders.push({ id: Date.now(), name: name.trim(), lang: "en-US", words: [] }); saveData(); renderFolderList(); } }
  function deleteFolder(id) { if (confirm("削除しますか？")) { appData.folders = appData.folders.filter(f => f.id !== id); saveData(); renderFolderList(); } }

  function openEdit(id) {
    currentFolderId = id; const f = appData.folders.find(x => x.id === id);
    $('editFolderTitle').innerText = f.name; $('folderLang').value = f.lang || "en-US";
    $('wordInput').value = f.words.map(w => `${w.q}\t${w.a}`).join('\n');
    $('errorBox').classList.add('hidden'); setAiMode('manual'); showScreen('edit');
  }
  function saveFolderLang() { const f = appData.folders.find(x => x.id === currentFolderId); if (f) { f.lang = $('folderLang').value; saveData(); } }

  function setAiMode(mode) {
    aiMode = mode;
    $('modeManual').className = "flex-1 text-sm font-bold rounded " + (mode === 'manual' ? "bg-white shadow text-blue-600" : "text-gray-500");
    $('modeAuto').className = "flex-1 text-sm font-bold rounded " + (mode === 'auto' ? "bg-white shadow text-purple-600" : "text-gray-500");
    $('editDesc').innerText = mode === 'manual' ? "1行に1語。単語と意味をスペース・カンマ・タブで区切って入力（AIが添削）" : "1行に1語。単語だけ入力（AIが意味を自動生成）";
  }

  // 1行 = 1エントリ（最初の区切りまでが単語、残りが意味）
  function parseLines(text) {
    return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const m = l.match(/^(\S+?)[\s,，、\t]+(.+)$/);
      return m ? { q: m[1], a: m[2].trim() } : { q: l, a: '' };
    });
  }

  function showError(msg) { const b = $('errorBox'); b.innerText = msg; b.classList.remove('hidden'); }

  async function processWords() {
    const text = $('wordInput').value.trim();
    if (!text) return;
    $('errorBox').classList.add('hidden');
    $('loadingOverlay').classList.remove('hidden');
    try {
      const response = await fetch('/api/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, aiMode })
      });
      let data;
      try { data = await response.json(); } catch { throw new Error(`サーバー応答が不正です (HTTP ${response.status})。Vercelにデプロイした /api/generate が動いているか確認してください。`); }
      if (!response.ok || data.error) throw new Error(data.error || `HTTP ${response.status}`);
      if (!Array.isArray(data.result) || !data.result.length) throw new Error("AIの結果が空でした。");

      // 入力側の単語と順番で突き合わせ、AIの返答が欠けても崩れないようにする
      const input = parseLines(text);
      tempValidatedWords = input.map((src, i) => {
        const r = data.result[i] || {};
        const q = src.q || r.q || '';
        if (aiMode === 'auto') return { q, a: r.a || src.a || '' };
        const ok = r.isCorrect !== false || !r.suggestion;
        return { q, a: src.a, isCorrect: ok, suggestion: r.suggestion || '' };
      });
      renderValidation();
    } catch (e) {
      showError("AIチェックに失敗しました: " + e.message + "\n「AIなしで保存」でそのまま登録もできます。");
    } finally {
      $('loadingOverlay').classList.add('hidden');
    }
  }

  function saveRawFromInput() {
    const f = appData.folders.find(x => x.id === currentFolderId);
    f.words = parseLines($('wordInput').value).map((p, i) => ({ id: Date.now() + i, q: p.q, a: p.a || "(未入力)", weak: false }));
    saveData(); showScreen('folder');
  }

  function renderValidation() {
    const list = $('validationList'); list.innerHTML = '';
    tempValidatedWords.forEach((it, idx) => {
      const div = document.createElement('div');
      const bad = aiMode === 'manual' && !it.isCorrect;
      div.className = `p-3 rounded border ${aiMode === 'auto' ? 'bg-white dark:bg-gray-800' : bad ? 'bg-red-50 border-red-300 dark:bg-red-950' : 'bg-green-50 border-green-200 dark:bg-green-950'}`;
      const label = aiMode === 'auto' ? '✨ 自動生成' : bad ? '⚠️ 修正案あり（元: ' + esc(it.a) + '）' : '✅ OK';
      const val = bad ? it.suggestion : it.a;
      div.innerHTML = `<div class="font-bold text-sm mb-2 ${bad ? 'text-red-600' : 'text-gray-600 dark:text-gray-300'}">${label}</div>
        <div class="flex flex-col sm:flex-row gap-2">
          <input type="text" id="val_q_${idx}" value="${esc(it.q)}" class="sm:w-1/2 p-2 border rounded text-lg text-gray-800">
          <input type="text" id="val_a_${idx}" value="${esc(val)}" class="sm:w-1/2 p-2 border rounded text-lg text-gray-800"></div>`;
      list.appendChild(div);
    });
    showScreen('validation');
  }

  function saveValidatedWords() {
    const f = appData.folders.find(x => x.id === currentFolderId);
    f.words = tempValidatedWords.map((_, i) => ({ id: Date.now() + i, q: $(`val_q_${i}`).value, a: $(`val_a_${i}`).value, weak: false })).filter(w => w.q.trim());
    saveData(); showScreen('folder');
  }

  function openTestSetting(id) {
    currentFolderId = id; const f = appData.folders.find(x => x.id === id);
    if (!f.words.length) return alert("単語がありません。「編集」から追加してね");
    $('testFolderTitle').innerText = f.name; showScreen('testSetting');
  }

  function startWeakTest() {
    const weak = []; appData.folders.forEach(f => f.words.forEach(w => { if (w.weak) weak.push({ ...w, _folderLang: f.lang }); }));
    if (!weak.length) return alert("苦手な単語はありません！🎉");
    testConfig.direction = document.querySelector('input[name="testDirection"]:checked').value;
    testQueue = weak.sort(() => Math.random() - .5); currentTestIndex = 0; showScreen('test'); showCard();
  }

  function startTest(count) {
    testConfig.direction = document.querySelector('input[name="testDirection"]:checked').value;
    const f = appData.folders.find(x => x.id === currentFolderId);
    const all = f.words.map(w => ({ ...w, _folderLang: f.lang })).sort(() => Math.random() - .5);
    testQueue = count === 'all' ? all : all.slice(0, count); currentTestIndex = 0; showScreen('test'); showCard();
  }

  // 文字数に応じてフォントサイズを調整（スマホで見切れない）
  function fit(el, text, big) {
    const n = text.length, w = window.innerWidth >= 768;
    let size = n <= 8 ? (w ? 64 : 40) : n <= 16 ? (w ? 48 : 30) : n <= 40 ? (w ? 36 : 22) : (w ? 28 : 18);
    el.style.fontSize = (big ? size : size * .9) + 'px'; el.innerText = text;
  }

  function showCard() {
    if (currentTestIndex >= testQueue.length) { alert("テスト完了です！"); saveData(); showScreen('folder'); return; }
    const card = $('flashcard'); card.classList.remove('flipped', 'swipe-right', 'swipe-left'); card.style.transform = '';
    $('judgementBtns').classList.add('opacity-0', 'pointer-events-none'); $('judgementBtns').classList.remove('opacity-100');
    $('ad-space').classList.add('hidden');
    const w = testQueue[currentTestIndex], fwd = testConfig.direction === 'forward';
    $('progressText').innerText = `${currentTestIndex + 1} / ${testQueue.length}`;
    fit($('cardQ'), fwd ? w.q : w.a, true); fit($('cardA'), fwd ? w.a : w.q, false);
    speakCurrentWord(true);
  }

  function flipCard() {
    const card = $('flashcard');
    if (!card.classList.contains('flipped')) {
      card.classList.add('flipped');
      $('judgementBtns').classList.remove('opacity-0', 'pointer-events-none'); $('judgementBtns').classList.add('opacity-100');
      $('ad-space').classList.remove('hidden');
    }
  }

  function judgeWord(ok) {
    const card = $('flashcard'), cur = testQueue[currentTestIndex];
    if (!cur || card.classList.contains('swipe-left') || card.classList.contains('swipe-right')) return;
    appData.folders.forEach(f => { const t = f.words.find(w => w.id === cur.id); if (t) t.weak = !ok; });
    saveData();
    card.classList.add(ok ? 'swipe-right' : 'swipe-left');
    setTimeout(() => { currentTestIndex++; showCard(); }, 400);
  }

  function setupSwipe() {
    const card = $('flashcard'); let startX = 0, dx = 0;
    card.addEventListener('touchstart', e => { if (!card.classList.contains('flipped')) return; startX = e.touches[0].clientX; dx = 0; card.style.transition = 'none'; }, { passive: true });
    card.addEventListener('touchmove', e => { if (!card.classList.contains('flipped')) return; dx = e.touches[0].clientX - startX; card.style.transform = `rotateY(180deg) translateX(${-dx}px) rotate(${dx / 20}deg)`; }, { passive: true });
    card.addEventListener('touchend', () => {
      if (!card.classList.contains('flipped')) return;
      card.style.transition = '';
      if (dx > 80) judgeWord(true); else if (dx < -80) judgeWord(false); else card.style.transform = '';
      dx = 0;
    });
  }

  function speakCurrentWord() {
    if (!window.speechSynthesis) return; const w = testQueue[currentTestIndex]; if (!w) return;
    const fwd = testConfig.direction === 'forward';
    window.speechSynthesis.cancel();
    const m = new SpeechSynthesisUtterance(fwd ? w.q : w.a); m.lang = fwd ? (w._folderLang || 'en-US') : 'ja-JP';
    window.speechSynthesis.speak(m);
  }

  function toggleDarkMode() { appData.settings.darkMode = $('darkModeToggle').checked; document.documentElement.classList.toggle('dark', appData.settings.darkMode); saveData(); }
  function exportData() { const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData)); a.download = "flashcard_backup.json"; a.click(); }
  function importData(ev) {
    const file = ev.target.files[0]; if (!file) return; const r = new FileReader();
    r.onload = e => { try { const d = JSON.parse(e.target.result); if (d.folders) { appData = d; appData.settings = appData.settings || {}; saveData(); showScreen('folder'); alert("復元完了！"); } } catch { alert("無効なファイルです。"); } };
    r.readAsText(file);
  }

  window.onload = init;
</script>
</body>
</html>
